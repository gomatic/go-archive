# Per-repo stickler overlay (deep-merged onto the distributed .golangci.yaml).
#
# This is the sanctioned home for go-archive's one local divergence: the shared
# .golangci.yaml is owned by nicerobot/tools.repository and is reset on every
# distribute push, so an exclude added there does not survive. An overlay here
# does, because stickler merges it after loading the base config.
#
# G305 (gosec "file traversal when extracting") is a false positive in this
# package: extractEntry guards every entry — and every symlink target — with
# withinDir before any filesystem write (asserted by TestExtract_PathTraversal
# and TestExtract_EscapingSymlinkIsRejected). gosec flags the unavoidable
# filepath.Join(dest, header.Name) regardless of the guard it cannot see.
config:
  golangci-lint:
    linters:
      settings:
        gosec:
          excludes:
            add:
              - G305

# Soft-finding baselines: how many non-gating findings this repository
# currently carries, per rule. This is a RATCHET — the counts may only fall.
# Exceeding one fails the build and names the rule; a rule absent here is
# permitted zero. Raising a number is a deliberate, reviewable decision.
#
# yze/invariant and yze/filesize are permanent probes (judgment-bound).
# yze/errtest, yze/errtested and yze/testfile are HARD rules softened only
# for rollout: they were structurally inert until the suite driver began
# loading test files, and return to gating once their counts reach zero.
# `soft:` is what makes a rule non-gating; `soft-baseline:` is only the
# per-rule ceiling APPLIED TO the rules named here. A baseline without a
# matching soft entry is inert — the rule stays hard and fails on its first
# finding whatever number is recorded beside it.
soft:
  # `add` MERGES with the global soft list; a plain sequence would REPLACE
  # it and silently harden every centrally-softened rule in this repo.
  add:
    - yze/filesize

soft-baseline:
  # Recorded from the 2026-08-02 full-suite sweep (stickler v0.10.0 /
  # yze v0.31.0): the counts at first contact with the current soft rule
  # set, on the ratchet — they may only fall. Probes (invariant, filesize,
  # enumdiscrim) await adjudication; rollout rules (errtest, errtested,
  # testfile, clidomain, cliflags, clilayout, fuzzreq, exhaustive) gate
  # again at zero.
  yze/filesize: 1
